<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DocSym — Comparateur de documents</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

        <script src="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone-min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <style>
            body { font-family: 'Inter', sans-serif; }
            h1, .wordmark { font-family: 'Space Grotesk', sans-serif; }
            .file-size, .hint { font-family: 'JetBrains Mono', monospace; }

            /* Styles spécifiques à Dropzone, difficiles à faire en pur Tailwind */
            .dropzone.dz-drag-hover { border-color: #6366f1; background-color: #eef2ff; }
            .dropzone .dz-message { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
        </style>
    </head>

    <body class="bg-slate-50 text-slate-900 min-h-screen">
        <div class="max-w-5xl mx-auto px-4 py-10 sm:py-16">

            <div class="mb-10">
                <div class="flex items-center gap-2 mb-4">
                    <span class="wordmark font-semibold tracking-tight">DocSym v1.0</span>
                </div>

                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">
                    Comparez vos documents en un instant
                </h1>

                <p class="text-slate-600 max-w-2xl">
                    Déposez deux fichiers pour mesurer leur similarité textuelle.
                    Traitement local, aucun document n'est conservé après l'analyse.
                </p>
            </div>

            <!-- Conteneur unique : formulaire + résultats -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                    <!-- Colonne formulaire -->
                    <div class="flex flex-col gap-4">
                        <form action="http://127.0.0.1:5000/upload" class="dropzone border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer transition-colors" id="form">
                            <div class="dz-message text-slate-500">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3v12"></path>
                                    <path d="M7 8l5-5 5 5"></path>
                                    <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path>
                                </svg>
                                <span class="action text-sm font-medium text-slate-700">Glissez vos fichiers ici, ou <u>parcourir</u></span>
                                <span class="hint text-xs text-slate-400">PDF, DOCX, TXT ou MD</span>
                                <span class="hint text-xs text-slate-400">16 Mo max par fichier</span>
                            </div>
                        </form>

                        <ul id="file-list" class="flex flex-col gap-2"></ul>

                        <div class="flex items-center gap-2 text-xs text-slate-400">
                            <span>2 fichiers max</span>
                            <span>·</span>
                            <span id="file-count">0 sélectionné</span>
                        </div>

                        <button id="upload-btn" type="button" disabled
                            class="mt-2 w-full rounded-lg bg-indigo-600 text-white font-medium py-2.5 transition-colors hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed">
                            Comparer les documents
                        </button>
                        <p class="status text-sm" id="status"></p>
                    </div>

                    <!-- Colonne résultats -->
                    <div class="flex flex-col h-[260px]">
                        <!-- <h2 class="text-lg font-semibold mb-4">Résultats</h2> -->
                        <div class="flex-1 min-h-[260px]">
                            <canvas id="myChart"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Scripts -->

        <script>
            const ctx = document.getElementById('myChart');

            const gaugeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Score'],
                    datasets: [{
                        data: [100],
                        backgroundColor: ['#e2e8f0'], 
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270,
                        cutout: '75%',
                        _gaugeValue: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false },
                        title: {
                            display: true,
                            text: 'Score de similarité',
                            position: 'top',
                            font: {weight: 'bold', size: 16},
                        }
                    }
                },
                plugins: [{
                    id: 'centerText',
                    afterDraw(chart) {
                        const { ctx, chartArea } = chart;
                        const value = chart.data.datasets[0]._gaugeValue;
                        if (value === undefined) return;
                        const x = (chartArea.left + chartArea.right) / 2;
                        const y = chartArea.bottom - 10;
                        ctx.save();
                        ctx.font = "600 22px 'Space Grotesk', sans-serif";
                        ctx.fillStyle = '#1e293b';
                        ctx.textAlign = 'center';
                        ctx.fillText(value + '%', x, y);
                        ctx.restore();
                    }
                }]
            });

            function updateGauge(value) {
                const color = value >= 70 ? '#22c55e'   
                            : value >= 40 ? '#f59e0b'   
                            : '#ef4444';                

                gaugeChart.data.datasets[0].data = [value, 100 - value];
                gaugeChart.data.datasets[0].backgroundColor = [color, '#e2e8f0'];
                gaugeChart.data.datasets[0]._gaugeValue = value;
                gaugeChart.update();
            }

        </script>

        <script>
            Dropzone.autoDiscover = false;

            const iconMap = {
                pdf:  { label: 'PDF', cls: 'bg-red-100 text-red-700' },
                doc:  { label: 'DOC', cls: 'bg-blue-100 text-blue-700' },
                docx: { label: 'DOC', cls: 'bg-blue-100 text-blue-700' },
                txt:  { label: 'TXT', cls: 'bg-slate-100 text-slate-700' },
                md:   { label: 'MD',  cls: 'bg-emerald-100 text-emerald-700' }
            };

            function getBadge(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                return iconMap[ext] || { label: '•', cls: 'bg-slate-100 text-slate-700' };
            }

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' o';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
                return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
            }

            const fileList = document.getElementById('file-list');
            const fileCount = document.getElementById('file-count');
            const uploadBtn = document.getElementById('upload-btn');
            const statusEl = document.getElementById('status');

            function updateCount() {
                const n = myDropzone.files.length;
                fileCount.textContent = n === 0 ? '0 sélectionné' : n + (n === 1 ? ' sélectionné' : ' sélectionnés');
                uploadBtn.disabled = n === 0;
            }

            const myDropzone = new Dropzone("#form", {
                url: "http://127.0.0.1:5000/upload",
                paramName: "files",
                maxFiles: 2,
                maxFilesize: 16,
                acceptedFiles: ".pdf,.txt,.md,.docx",
                addRemoveLinks: false,
                uploadMultiple: true,
                autoProcessQueue: false,
                dictDefaultMessage: "",
                previewsContainer: false,
                init: function () {
                    const dz = this;

                    dz.on("addedfile", function (file) {
                        const badge = getBadge(file.name);
                        const row = document.createElement('li');
                        row.className = 'flex items-center gap-3 rounded-lg border border-slate-200 px-3 py-2';
                        row.id = 'file-' + file.upload.uuid;
                        row.innerHTML = `
                            <span class="text-[10px] font-semibold px-2 py-1 rounded ${badge.cls}">${badge.label}</span>
                            <span class="flex-1 min-w-0">
                                <div class="file-name text-sm font-medium truncate">${file.name}</div>
                                <div class="file-size text-xs text-slate-400">${formatSize(file.size)}</div>
                            </span>
                            <button type="button" class="file-remove text-slate-400 hover:text-red-500" aria-label="Retirer ${file.name}">✕</button>
                        `;
                        row.querySelector('.file-remove').addEventListener('click', () => dz.removeFile(file));
                        fileList.appendChild(row);
                        updateCount();
                    });

                    dz.on("removedfile", function (file) {
                        const row = document.getElementById('file-' + file.upload.uuid);
                        if (row) row.remove();
                        updateCount();
                    });

                    dz.on("maxfilesexceeded", function (file) {
                        dz.removeFile(file);
                        statusEl.textContent = "Deux fichiers maximum.";
                        statusEl.className = 'status text-sm text-red-500';
                    });

                    dz.on("sending", function () {
                        uploadBtn.disabled = true;
                        uploadBtn.textContent = "Analyse en cours…";
                        statusEl.textContent = "";
                        statusEl.className = 'status text-sm';
                    });

                    dz.on("success", function (files, response) {
                        let data;
                        try {
                            data = typeof response === 'string' ? JSON.parse(response) : response;
                        } catch (e) {
                            console.error("Réponse non-JSON reçue :", response);
                            statusEl.textContent = "Réponse invalide du serveur.";
                            statusEl.className = 'status text-sm text-red-500';
                            return;
                        }

                        // console.log(data);
                        let score = (data.score * 100).toFixed(1)
                        updateGauge(score);

                    });

                    dz.on("error", function (file, message) {
                        statusEl.textContent = typeof message === 'string' ? message : "Échec de l'envoi. Réessayez.";
                        statusEl.className = 'status text-sm text-red-500';
                    });

                    dz.on("queuecomplete", function () {
                        uploadBtn.disabled = myDropzone.files.length === 0;
                        uploadBtn.textContent = "Comparer les documents";
                        // this.removeAllFiles( true );
                    });
                }
            });

            uploadBtn.addEventListener('click', function () {
                if (myDropzone.files.length === 0) return;
                myDropzone.processQueue();
            });
        </script>

    </body>

</html>
